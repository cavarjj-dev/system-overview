<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A plain look at a setup you could have. Your account. Your files. You can stop.">
<title>Your own assistant</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #fffcf8;
    --ink: #1c1916;
    --muted: #5e574e;
    --faint: #8a8176;
    --line: #e4dcd0;
    --green: #1e4d3a;
    --green-soft: #e7f0eb;
    --clay-soft: #f8ece7;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.55 "Segoe UI", system-ui, sans-serif;
  }
  a { color: var(--green); }
  header, main, footer { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
  header { padding: 56px 0 8px; }
  .kicker { margin: 0 0 14px; color: var(--green); font-size: 13px; font-weight: 650; }
  h1 {
    margin: 0 0 16px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.02;
  }
  .lede { max-width: 62ch; margin: 0 0 22px; color: var(--muted); font-size: 20px; }
  .jumps { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .jumps a {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    background: var(--ink); color: #fff; text-decoration: none; font-size: 14px;
  }
  .jumps a.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .meta { color: var(--faint); font-size: 14px; margin: 18px 0 0; }
  nav {
    position: sticky; top: 0; z-index: 2;
    background: rgba(244, 241, 235, 0.94);
    border-bottom: 1px solid var(--line);
    margin-top: 28px;
  }
  nav ul {
    width: min(980px, calc(100% - 40px));
    margin: 0 auto; padding: 12px 0;
    display: flex; gap: 18px; flex-wrap: wrap; list-style: none;
  }
  nav a { color: var(--muted); font-size: 14px; text-decoration: none; }
  nav a:hover { color: var(--ink); }
  section { padding: 42px 0 6px; }
  h2 {
    margin: 0 0 8px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: 32px; font-weight: 500; letter-spacing: -0.02em;
  }
  .intro { max-width: 68ch; color: var(--muted); margin: 0 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile, .card, .col, .step {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 18px 16px;
  }
  .tile strong, .card h3 { display: block; margin: 0 0 6px; font-size: 17px; }
  .tile span, .why { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .col.yes { background: var(--green-soft); border-color: #c9ddd1; }
  .col.no { background: var(--clay-soft); border-color: #ead8d1; }
  .col h3 { font-family: Georgia, Palatino, serif; font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 6px 0; }
  .steps { display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
  .num {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: grid; place-items: center;
    font-family: Georgia, Palatino, serif; font-size: 20px;
  }
  .facts { margin: 0; }
  .facts div {
    display: grid; grid-template-columns: 180px 1fr; gap: 16px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .facts dt { font-weight: 650; }
  .facts dd { margin: 0; color: var(--muted); }
  .limit { padding: 14px 0; border-top: 1px solid var(--line); }
  .limit strong { display: block; margin-bottom: 4px; }
  .limit p { margin: 0; color: var(--muted); }
  footer { padding: 36px 0 64px; color: var(--faint); font-size: 14px; }
  .claim {
    margin: 0 0 18px;
    font-family: Georgia, Palatino, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .story { display: flex; flex-direction: column; margin-top: 8px; }
  .beat { display: grid; grid-template-columns: 36px 1fr; column-gap: 14px; }
  .spine { display: flex; flex-direction: column; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); margin-top: 22px; flex: 0 0 12px; }
  .line { width: 2px; flex: 1; background: #d7e3db; min-height: 16px; }
  .beat-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .beat-card h3 {
    font-family: Georgia, Palatino, serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .beat-card p { margin: 0; color: var(--muted); }
  @media (max-width: 800px) {
    .tiles, .grid, .grid.three { grid-template-columns: 1fr; }
    .facts div { grid-template-columns: 1fr; gap: 4px; }
    .beat-card h3 { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">Plain words</p>
  <h1 id="title">Your own assistant</h1>
  <p class="lede" id="lede">Loading.</p>
  <div class="jumps">
    <a href="#run">The details</a>
    <a class="quiet" href="#gift">If this is for you</a>
  </div>
  <p class="meta" id="meta"></p>
</header>
<nav>
  <ul>
    <li><a href="#picture">The picture</a></li>
    <li><a href="#have">What you get</a></li>
    <li><a href="#can">Will and will not</a></li>
    <li><a href="#setup">How it sits</a></li>
    <li><a href="#private">What stays private</a></li>
    <li><a href="#gift">If this is for you</a></li>
    <li><a href="#run">The details</a></li>
  </ul>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const DATA_VERSION = "20261029T1827";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function items(list) {
  return `<ul>${(list || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}
function render(data) {
  document.title = data.title;
  document.getElementById("title").textContent = data.title;
  document.getElementById("lede").textContent = data.lede;
  document.getElementById("meta").textContent = data.updated_at + " CT. " + data.snapshot;
  const tiles = (data.tiles || []).map(t =>
    `<article class="tile"><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span></article>`
  ).join("");
  const setup = (data.setup || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p>${items(c.points)}</article>`
  ).join("");
  const security = (data.security || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const folders = (data.folders || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const required = (data.gift.required || []).map((step, i) =>
    `<article class="step"><div class="num">${i + 1}</div><div><strong>${esc(step.title)}</strong><p class="why">${esc(step.text)}</p></div></article>`
  ).join("");
  const facts = (data.operator.facts || []).map(f =>
    `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`
  ).join("");
  const limits = (data.limits || []).map(g =>
    `<div class="limit"><strong>${esc(g.title)}</strong><p>${esc(g.detail)}</p></div>`
  ).join("");
  document.getElementById("main").innerHTML = `
    <section id="picture">
      <h2>How it fits together</h2>
      <p class="claim">Your account. Your files. You can stop.</p>
      <p class="intro">This is the shape already running. Simple to use. A lot of care underneath. If a piece of it looks useful, say which piece. You do not have to take all of it.</p>
      <div class="story">
        <article class="beat">
          <div class="spine"><div class="dot"></div><div class="line"></div></div>
          <div class="beat-card">
            <h3>Your own account</h3>
            <p>You own the sign-in. It is not shared. You can stop, or not use it, anytime. That is your call.</p>
          </div>
        </article>
        <article class="beat">
          <div class="spine"><div class="dot"></div><div class="line"></div></div>
          <div class="beat-card">
            <h3>An assistant that takes the next step</h3>
            <p>You talk. It drafts. It can learn how you like the work done, as you show it. It does not quietly keep every sentence. Some people call this an agent. That only means it can do the step you named, not only answer a question.</p>
          </div>
        </article>
        <article class="beat">
          <div class="spine"><div class="dot"></div><div class="line"></div></div>
          <div class="beat-card">
            <h3>The model, picked for the work</h3>
            <p>You can start with a set amount each month. If the work needs a stronger model, we open that. Open means the model can run on the computer, so private words can stay here. Closed means a company runs it, and those words leave the machine. We pick that on purpose.</p>
          </div>
        </article>
        <article class="beat">
          <div class="spine"><div class="dot"></div><div class="line"></div></div>
          <div class="beat-card">
            <h3>A folder, with a private drawer</h3>
            <p>One folder, just for this assistant. Everyday files in one drawer. Sensitive files in another. You will know where the finished work lands. You will know where to put the file that needs care. The assistant can help you sort that. It does not open a file because it is nearby.</p>
          </div>
        </article>
        <article class="beat">
          <div class="spine"><div class="dot"></div><div class="line"></div></div>
          <div class="beat-card">
            <h3>The work, and what it can connect to</h3>
            <p>A report. An invoice. A draft email. A watch on the thing you name. Useful for a small business. Useful for getting a personal life in order. Email, a calendar, a spreadsheet, Google Drive: only the ones you want. It can check the jobs you asked it to check. It does not make a mistake impossible.</p>
          </div>
        </article>
        <article class="beat">
          <div class="spine"><div class="dot"></div></div>
          <div class="beat-card">
            <h3>You can turn it off</h3>
            <p>Anytime. The account stays yours. Stopping is not a favor you have to ask for.</p>
          </div>
        </article>
      </div>
    </section>
    <section id="have">
      <h2>What you would have</h2>
      <p class="intro">${esc(data.have_intro)}</p>
      <div class="tiles">${tiles}</div>
    </section>
    <section id="can">
      <h2>What it will do, and what it will not</h2>
      <p class="intro">${esc(data.skills_intro)}</p>
      <div class="grid">
        <article class="col yes"><h3>It will</h3>${items(data.can)}</article>
        <article class="col no"><h3>It will not</h3>${items(data.cannot)}</article>
      </div>
    </section>
    <section id="setup">
      <h2>How the pieces sit</h2>
      <p class="intro">${esc(data.setup_intro)}</p>
      <div class="grid three">${setup}</div>
      <h2 style="margin-top:28px">Where your files live</h2>
      <p class="intro">${esc(data.folders_intro)}</p>
      <div class="grid">${folders}</div>
    </section>
    <section id="private">
      <h2>What stays private</h2>
      <p class="intro">${esc(data.security_intro)}</p>
      <div class="grid">${security}</div>
    </section>
    <section id="gift">
      <h2>If this is for you</h2>
      <p class="intro">${esc(data.gift.intro)}</p>
      <div class="steps">${required}</div>
      <div class="grid" style="margin-top:14px">
        <article class="col yes"><h3>How you use it</h3>${items(data.gift.easy)}</article>
        <article class="col no"><h3>What you do not get</h3>${items(data.gift.not)}</article>
      </div>
    </section>
    <section id="run">
      <h2>The details</h2>
      <p class="intro">${esc(data.operator.intro)}</p>
      <dl class="facts">${facts}</dl>
      ${items(data.operator.notes)}
      <h2 style="margin-top:28px">What we will not promise</h2>
      <p class="intro">These limits stay true. A clean page does not make them go away.</p>
      ${limits}
      <div class="limit">
        <strong>Not on this page</strong>
        <p>If a name or a key is missing, that is on purpose.</p>
        ${items(data.not_on_this_page)}
      </div>
    </section>
  `;
  document.getElementById("foot").textContent = data.footer;
}

fetch("overview.json?v=" + DATA_VERSION, { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("snapshot missing");
    return r.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("lede").textContent = "The snapshot did not load. The page is the viewer. The record is overview.json beside it.";
  });
</script>
</body>
</html>
