<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="How one practice assistant is set up, why, and what someone else would get. No client work on this page.">
<title>How this assistant is set up</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #fffcf8;
    --ink: #1c1916;
    --muted: #5e574e;
    --faint: #8a8176;
    --line: #e4dcd0;
    --green: #1e4d3a;
    --green-soft: #e7f0eb;
    --clay-soft: #f8ece7;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.55 "Segoe UI", system-ui, sans-serif;
  }
  a { color: var(--green); }
  header, main, footer { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
  header { padding: 56px 0 8px; }
  .kicker { margin: 0 0 14px; color: var(--green); font-size: 13px; font-weight: 650; }
  h1 {
    margin: 0 0 16px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.02;
  }
  .lede { max-width: 62ch; margin: 0 0 22px; color: var(--muted); font-size: 20px; }
  .jumps { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .jumps a {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    background: var(--ink); color: #fff; text-decoration: none; font-size: 14px;
  }
  .jumps a.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .meta { color: var(--faint); font-size: 14px; margin: 18px 0 0; }
  nav {
    position: sticky; top: 0; z-index: 2;
    background: rgba(244, 241, 235, 0.94);
    border-bottom: 1px solid var(--line);
    margin-top: 28px;
  }
  nav ul {
    width: min(980px, calc(100% - 40px));
    margin: 0 auto; padding: 12px 0;
    display: flex; gap: 18px; flex-wrap: wrap; list-style: none;
  }
  nav a { color: var(--muted); font-size: 14px; text-decoration: none; }
  nav a:hover { color: var(--ink); }
  section { padding: 42px 0 6px; }
  h2 {
    margin: 0 0 8px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: 32px; font-weight: 500; letter-spacing: -0.02em;
  }
  .intro { max-width: 68ch; color: var(--muted); margin: 0 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile, .card, .col, .step {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 18px 16px;
  }
  .tile strong, .card h3 { display: block; margin: 0 0 6px; font-size: 17px; }
  .tile span, .why { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .col.yes { background: var(--green-soft); border-color: #c9ddd1; }
  .col.no { background: var(--clay-soft); border-color: #ead8d1; }
  .col h3 { font-family: Georgia, Palatino, serif; font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 6px 0; }
  .steps { display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
  .num {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: grid; place-items: center;
    font-family: Georgia, Palatino, serif; font-size: 20px;
  }
  .facts { margin: 0; }
  .facts div {
    display: grid; grid-template-columns: 180px 1fr; gap: 16px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .facts dt { font-weight: 650; }
  .facts dd { margin: 0; color: var(--muted); }
  .limit { padding: 14px 0; border-top: 1px solid var(--line); }
  .limit strong { display: block; margin-bottom: 4px; }
  .limit p { margin: 0; color: var(--muted); }
  footer { padding: 36px 0 64px; color: var(--faint); font-size: 14px; }
  .claim {
    margin: 0 0 18px;
    font-family: Georgia, Palatino, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .picture {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 22px 22px;
  }
  .hub { display: flex; flex-direction: column; align-items: center; }
  .box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
    width: min(280px, 100%);
  }
  .box strong { display: block; margin-bottom: 4px; }
  .box span, .arm span { color: var(--muted); font-size: 15px; }
  .stem { width: 2px; height: 28px; background: var(--green); }
  .arms {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-top: 0;
  }
  .arm { display: flex; flex-direction: column; align-items: center; }
  .arm .stem { height: 22px; }
  .bar {
    width: min(640px, 72%);
    height: 2px;
    background: var(--green);
  }
  .split { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; margin-top: 22px; }
  .side {
    border-radius: 16px;
    padding: 16px 16px 8px;
  }
  .side.shared { background: var(--clay-soft); }
  .side.ours { background: var(--green-soft); }
  .side p { margin: 0 0 8px; }
  .tag { font-size: 13px; font-weight: 650; letter-spacing: 0.02em; text-transform: uppercase; }
  .versus {
    align-self: center;
    color: var(--faint);
    font-size: 13px;
    font-weight: 650;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  @media (max-width: 800px) {
    .tiles, .grid, .grid.three, .arms, .split { grid-template-columns: 1fr; }
    .versus { writing-mode: horizontal-tb; transform: none; text-align: center; }
    .bar { display: none; }
    .facts div { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">A brief, not a control panel</p>
  <h1 id="title">How this assistant is set up</h1>
  <p class="lede" id="lede">Loading.</p>
  <div class="jumps">
    <a href="#run">I run this</a>
    <a class="quiet" href="#gift">I am getting one</a>
  </div>
  <p class="meta" id="meta"></p>
</header>
<nav>
  <ul>
    <li><a href="#picture">How it works</a></li>
    <li><a href="#have">What we have</a></li>
    <li><a href="#can">Can and cannot</a></li>
    <li><a href="#setup">Setup</a></li>
    <li><a href="#private">Privacy</a></li>
    <li><a href="#gift">Getting one</a></li>
    <li><a href="#run">For the operator</a></li>
  </ul>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const DATA_VERSION = "20261029T1809";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function items(list) {
  return `<ul>${(list || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}
function render(data) {
  document.title = data.title;
  document.getElementById("title").textContent = data.title;
  document.getElementById("lede").textContent = data.lede;
  document.getElementById("meta").textContent = data.updated_at + " CT. " + data.snapshot;
  const tiles = (data.tiles || []).map(t =>
    `<article class="tile"><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span></article>`
  ).join("");
  const setup = (data.setup || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p>${items(c.points)}</article>`
  ).join("");
  const security = (data.security || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const folders = (data.folders || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const required = (data.gift.required || []).map((step, i) =>
    `<article class="step"><div class="num">${i + 1}</div><div><strong>${esc(step.title)}</strong><p class="why">${esc(step.text)}</p></div></article>`
  ).join("");
  const facts = (data.operator.facts || []).map(f =>
    `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`
  ).join("");
  const limits = (data.limits || []).map(g =>
    `<div class="limit"><strong>${esc(g.title)}</strong><p>${esc(g.detail)}</p></div>`
  ).join("");
  document.getElementById("main").innerHTML = `
    <section id="picture">
      <h2>How it works</h2>
      <p class="claim">A mind that is not shared.</p>
      <p class="intro">You talk. The assistant sits on a computer. What happens next depends on the kind of work. A second person does not join your mind. They get their own.</p>
      <div class="picture">
        <div class="hub">
          <div class="box"><strong>You talk</strong><span>Where you already talk. You do not learn a terminal.</span></div>
          <div class="stem"></div>
          <div class="box"><strong>Your assistant</strong><span>On a computer. Your files. Your memory. Not a shared login.</span></div>
          <div class="stem"></div>
          <div class="bar"></div>
        </div>
        <div class="arms">
          <div class="arm">
            <div class="stem"></div>
            <div class="box"><strong>Stays here</strong><span>A file you name. Private talk. It does not go out.</span></div>
          </div>
          <div class="arm">
            <div class="stem"></div>
            <div class="box"><strong>You decide</strong><span>It drafts. You send the email, the post, the page.</span></div>
          </div>
          <div class="arm">
            <div class="stem"></div>
            <div class="box"><strong>Their own mind</strong><span>Not your login. Not your files. Not your memory.</span></div>
          </div>
        </div>
        <div class="split">
          <article class="side shared">
            <p class="tag">A shared chatbot</p>
            <p>One login. One memory. The company keeps the talk. Anyone on that account can meet what you said.</p>
          </article>
          <div class="versus">not this</div>
          <article class="side ours">
            <p class="tag">This</p>
            <p>Your memory stays on the computer. Private talk stays. A second person gets a separate mind. The person who keeps the computer on can see if it is up. They cannot read the talk.</p>
          </article>
        </div>
      </div>
      <h2 style="margin-top:36px">What this is about</h2>
      <p class="intro">The line, if you are explaining it. Also the line to keep learning. Do not add a product name to it.</p>
      <div class="tiles">
        <article class="tile"><strong>They talk</strong><span>They do not learn a terminal, and they do not inherit this personality.</span></article>
        <article class="tile"><strong>Their files stay theirs</strong><span>Not this practice's files. Not a folder inside someone else's account.</span></article>
        <article class="tile"><strong>They decide what leaves</strong><span>Public work can go out. Private talk stays. They do not edit a settings file to say so.</span></article>
        <article class="tile"><strong>Up is visible. The talk is not.</strong><span>Someone can keep the computer on and see whether it is up. They cannot read the conversation.</span></article>
      </div>
      <p class="intro" style="margin-top:16px">That is the market line. It is not a coach, a sealed vault, a separate computer, or a promise that a cloud company keeps nothing. Those limits are still on this page.</p>
    </section>
    <section id="have">
      <h2>What we have, and why</h2>
      <p class="intro">${esc(data.have_intro)}</p>
      <div class="tiles">${tiles}</div>
    </section>
    <section id="can">
      <h2>What it can do, and what it cannot</h2>
      <p class="intro">${esc(data.skills_intro)}</p>
      <div class="grid">
        <article class="col yes"><h3>It can</h3>${items(data.can)}</article>
        <article class="col no"><h3>It cannot</h3>${items(data.cannot)}</article>
      </div>
    </section>
    <section id="setup">
      <h2>How it is set up</h2>
      <p class="intro">${esc(data.setup_intro)}</p>
      <div class="grid three">${setup}</div>
      <h2 style="margin-top:28px">Where things live</h2>
      <p class="intro">${esc(data.folders_intro)}</p>
      <div class="grid">${folders}</div>
    </section>
    <section id="private">
      <h2>What stays private</h2>
      <p class="intro">${esc(data.security_intro)}</p>
      <div class="grid">${security}</div>
    </section>
    <section id="gift">
      <h2>If you are getting one</h2>
      <p class="intro">${esc(data.gift.intro)}</p>
      <div class="steps">${required}</div>
      <div class="grid" style="margin-top:14px">
        <article class="col yes"><h3>How you use it</h3>${items(data.gift.easy)}</article>
        <article class="col no"><h3>What you do not get</h3>${items(data.gift.not)}</article>
      </div>
    </section>
    <section id="run">
      <h2>For the person who runs this</h2>
      <p class="intro">${esc(data.operator.intro)}</p>
      <dl class="facts">${facts}</dl>
      ${items(data.operator.notes)}
      <h2 style="margin-top:28px">Still true, and not a promise</h2>
      <p class="intro">These are the limits. A clean page does not make them go away.</p>
      ${limits}
      <div class="limit">
        <strong>Not on this page</strong>
        <p>If a name or a key is missing, that is the fence.</p>
        ${items(data.not_on_this_page)}
      </div>
    </section>
  `;
  document.getElementById("foot").textContent = data.footer;
}

fetch("overview.json?v=" + DATA_VERSION, { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("snapshot missing");
    return r.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("lede").textContent = "The snapshot did not load. The page is the viewer. The record is overview.json beside it.";
  });
</script>
</body>
</html>
