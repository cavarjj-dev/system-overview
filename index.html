<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="How one practice assistant is set up, why, and what someone else would get. No client work on this page.">
<title>How this assistant is set up</title>
<style>
  :root {
    --bg: #f4f1eb;
    --paper: #fffcf8;
    --ink: #1c1916;
    --muted: #5e574e;
    --faint: #8a8176;
    --line: #e4dcd0;
    --green: #1e4d3a;
    --green-soft: #e7f0eb;
    --clay-soft: #f8ece7;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.55 "Segoe UI", system-ui, sans-serif;
  }
  a { color: var(--green); }
  header, main, footer { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
  header { padding: 56px 0 8px; }
  .kicker { margin: 0 0 14px; color: var(--green); font-size: 13px; font-weight: 650; }
  h1 {
    margin: 0 0 16px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.02;
  }
  .lede { max-width: 62ch; margin: 0 0 22px; color: var(--muted); font-size: 20px; }
  .jumps { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 8px; }
  .jumps a {
    display: inline-block; padding: 8px 14px; border-radius: 999px;
    background: var(--ink); color: #fff; text-decoration: none; font-size: 14px;
  }
  .jumps a.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .meta { color: var(--faint); font-size: 14px; margin: 18px 0 0; }
  nav {
    position: sticky; top: 0; z-index: 2;
    background: rgba(244, 241, 235, 0.94);
    border-bottom: 1px solid var(--line);
    margin-top: 28px;
  }
  nav ul {
    width: min(980px, calc(100% - 40px));
    margin: 0 auto; padding: 12px 0;
    display: flex; gap: 18px; flex-wrap: wrap; list-style: none;
  }
  nav a { color: var(--muted); font-size: 14px; text-decoration: none; }
  nav a:hover { color: var(--ink); }
  section { padding: 42px 0 6px; }
  h2 {
    margin: 0 0 8px;
    font-family: Georgia, "Palatino Linotype", Palatino, serif;
    font-size: 32px; font-weight: 500; letter-spacing: -0.02em;
  }
  .intro { max-width: 68ch; color: var(--muted); margin: 0 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile, .card, .col, .step {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 18px 16px;
  }
  .tile strong, .card h3 { display: block; margin: 0 0 6px; font-size: 17px; }
  .tile span, .why { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .col.yes { background: var(--green-soft); border-color: #c9ddd1; }
  .col.no { background: var(--clay-soft); border-color: #ead8d1; }
  .col h3 { font-family: Georgia, Palatino, serif; font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  li { margin: 6px 0; }
  .steps { display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; }
  .num {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: grid; place-items: center;
    font-family: Georgia, Palatino, serif; font-size: 20px;
  }
  .facts { margin: 0; }
  .facts div {
    display: grid; grid-template-columns: 180px 1fr; gap: 16px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .facts dt { font-weight: 650; }
  .facts dd { margin: 0; color: var(--muted); }
  .limit { padding: 14px 0; border-top: 1px solid var(--line); }
  .limit strong { display: block; margin-bottom: 4px; }
  .limit p { margin: 0; color: var(--muted); }
  footer { padding: 36px 0 64px; color: var(--faint); font-size: 14px; }
  .claim {
    margin: 0 0 18px;
    font-family: Georgia, Palatino, serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .scene {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 28px;
    align-items: start;
    background:
      radial-gradient(circle at 12% 18%, #e7f0eb 0, transparent 42%),
      var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 24px 22px;
  }
  .you { text-align: center; }
  .you svg { width: min(180px, 100%); height: auto; display: block; margin: 0 auto 14px; }
  .you p { margin: 0; color: var(--muted); font-size: 15px; }
  .you strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .cabinet svg { width: 100%; height: auto; display: block; }
  .shelf {
    display: grid;
    grid-template-columns: 42px 1fr;
    gap: 12px;
    align-items: start;
    background: rgba(255, 252, 248, 0.86);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--green); color: #fff;
    display: grid; place-items: center;
    font-family: Georgia, Palatino, serif; font-size: 20px;
  }
  .shelf h3 { margin: 0 0 4px; font-size: 18px; }
  .shelf p { margin: 0; color: var(--muted); }
  .quiet-line { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
  @media (max-width: 800px) {
    .tiles, .grid, .grid.three, .scene { grid-template-columns: 1fr; }
    .facts div { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">Plain words</p>
  <h1 id="title">How this assistant is set up</h1>
  <p class="lede" id="lede">Loading.</p>
  <div class="jumps">
    <a href="#run">I run this</a>
    <a class="quiet" href="#gift">I am getting one</a>
  </div>
  <p class="meta" id="meta"></p>
</header>
<nav>
  <ul>
    <li><a href="#picture">How it works</a></li>
    <li><a href="#have">What we have</a></li>
    <li><a href="#can">Can and cannot</a></li>
    <li><a href="#setup">Setup</a></li>
    <li><a href="#private">Privacy</a></li>
    <li><a href="#gift">Getting one</a></li>
    <li><a href="#run">The details</a></li>
  </ul>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const DATA_VERSION = "20261029T1821";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function items(list) {
  return `<ul>${(list || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}
function render(data) {
  document.title = data.title;
  document.getElementById("title").textContent = data.title;
  document.getElementById("lede").textContent = data.lede;
  document.getElementById("meta").textContent = data.updated_at + " CT. " + data.snapshot;
  const tiles = (data.tiles || []).map(t =>
    `<article class="tile"><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span></article>`
  ).join("");
  const setup = (data.setup || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p>${items(c.points)}</article>`
  ).join("");
  const security = (data.security || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const folders = (data.folders || []).map(c =>
    `<article class="card"><h3>${esc(c.title)}</h3><p class="why">${esc(c.why)}</p></article>`
  ).join("");
  const required = (data.gift.required || []).map((step, i) =>
    `<article class="step"><div class="num">${i + 1}</div><div><strong>${esc(step.title)}</strong><p class="why">${esc(step.text)}</p></div></article>`
  ).join("");
  const facts = (data.operator.facts || []).map(f =>
    `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`
  ).join("");
  const limits = (data.limits || []).map(g =>
    `<div class="limit"><strong>${esc(g.title)}</strong><p>${esc(g.detail)}</p></div>`
  ).join("");
  document.getElementById("main").innerHTML = `
    <section id="picture">
      <h2>How it fits together</h2>
      <p class="claim">You talk. Someone else carries the setup.</p>
      <p class="intro">You already have a phone and a computer. That is enough. Behind that is a desk built for your work. The tools can change. The desk stays.</p>
      <div class="scene">
        <div class="you">
          <svg viewBox="0 0 200 250" aria-hidden="true">
            <rect x="118" y="8" width="46" height="86" rx="10" fill="#fffcf8" stroke="#1e4d3a" stroke-width="2.5"/>
            <rect x="126" y="20" width="30" height="52" rx="4" fill="#e7f0eb"/>
            <circle cx="141" cy="82" r="3" fill="#1e4d3a"/>
            <rect x="24" y="108" width="152" height="96" rx="10" fill="#fffcf8" stroke="#1c1916" stroke-width="2.5"/>
            <rect x="36" y="120" width="128" height="68" rx="6" fill="#e7f0eb"/>
            <rect x="12" y="206" width="176" height="12" rx="6" fill="#1c1916"/>
            <circle cx="100" cy="154" r="10" fill="#1e4d3a"/>
          </svg>
          <p><strong>You, today</strong>Your phone. Your computer. You talk. You do not learn a setup screen.</p>
        </div>
        <div class="cabinet">
          <svg viewBox="0 0 640 540" role="img" aria-label="The layers behind the assistant">
            <rect x="8" y="8" width="624" height="524" rx="28" fill="#fffcf8" stroke="#e4dcd0"/>
            <rect x="8" y="8" width="10" height="524" rx="5" fill="#1e4d3a"/>
            <g>
              <rect x="36" y="28" width="568" height="88" rx="16" fill="#e7f0eb"/>
              <circle cx="78" cy="72" r="16" fill="#1e4d3a"/>
              <path d="M70 68 h16 M70 76 h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <text x="108" y="64" fill="#1c1916" font-family="Georgia, Palatino, serif" font-size="22">Your assistant</text>
              <text x="108" y="90" fill="#5e574e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">You talk. It drafts. You send.</text>
            </g>
            <g>
              <rect x="36" y="128" width="568" height="88" rx="16" fill="#f4f1eb"/>
              <rect x="58" y="152" width="28" height="36" rx="3" fill="#1e4d3a"/>
              <rect x="90" y="158" width="28" height="30" rx="3" fill="#8a8176"/>
              <rect x="122" y="150" width="28" height="38" rx="3" fill="#1c1916"/>
              <text x="168" y="164" fill="#1c1916" font-family="Georgia, Palatino, serif" font-size="22">Your files</text>
              <text x="168" y="190" fill="#5e574e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">Tasks, projects, and the work you want help with.</text>
            </g>
            <g>
              <rect x="36" y="228" width="568" height="88" rx="16" fill="#f8ece7"/>
              <rect x="58" y="256" width="34" height="24" rx="4" fill="none" stroke="#1c1916" stroke-width="2"/>
              <path d="M58 262 l17 10 17-10" fill="none" stroke="#1c1916" stroke-width="2"/>
              <rect x="104" y="252" width="28" height="30" rx="3" fill="none" stroke="#1e4d3a" stroke-width="2"/>
              <circle cx="154" cy="268" r="14" fill="none" stroke="#1c1916" stroke-width="2"/>
              <circle cx="196" cy="268" r="14" fill="none" stroke="#1e4d3a" stroke-width="2" stroke-dasharray="3 3"/>
              <text x="224" y="264" fill="#1c1916" font-family="Georgia, Palatino, serif" font-size="22">The tools</text>
              <text x="224" y="290" fill="#5e574e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">The right one for the job. Room for the next one.</text>
            </g>
            <g>
              <rect x="36" y="328" width="568" height="88" rx="16" fill="#f4f1eb"/>
              <rect x="58" y="352" width="46" height="30" rx="4" fill="none" stroke="#1c1916" stroke-width="2"/>
              <rect x="50" y="384" width="62" height="6" rx="3" fill="#1c1916"/>
              <path d="M128 384 v-22 h28 v22" fill="none" stroke="#1e4d3a" stroke-width="2"/>
              <path d="M126 364 l16-12 16 12" fill="none" stroke="#1e4d3a" stroke-width="2"/>
              <text x="176" y="364" fill="#1c1916" font-family="Georgia, Palatino, serif" font-size="22">Where it lives</text>
              <text x="176" y="390" fill="#5e574e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">On your computer, or hosted for you. You only talk.</text>
            </g>
            <g>
              <rect x="36" y="428" width="568" height="80" rx="16" fill="#e7f0eb"/>
              <path d="M58 484 l28-28 16 16 36-40" fill="none" stroke="#1e4d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="160" y="462" fill="#1c1916" font-family="Georgia, Palatino, serif" font-size="22">It keeps getting better</text>
              <text x="160" y="488" fill="#5e574e" font-family="Segoe UI, system-ui, sans-serif" font-size="15">We change the tool. Your desk stays.</text>
            </g>
          </svg>
        </div>
      </div>
      <p class="quiet-line">Secure, in plain words: your files have their own place, private talk stays, and the person who keeps it running can see that it is up. They cannot read what you said. That is a rule we keep. It is not a locked room.</p>
    </section>
    <section id="have">
      <h2>What we have, and why</h2>
      <p class="intro">${esc(data.have_intro)}</p>
      <div class="tiles">${tiles}</div>
    </section>
    <section id="can">
      <h2>What it can do, and what it cannot</h2>
      <p class="intro">${esc(data.skills_intro)}</p>
      <div class="grid">
        <article class="col yes"><h3>It can</h3>${items(data.can)}</article>
        <article class="col no"><h3>It cannot</h3>${items(data.cannot)}</article>
      </div>
    </section>
    <section id="setup">
      <h2>How it is set up</h2>
      <p class="intro">${esc(data.setup_intro)}</p>
      <div class="grid three">${setup}</div>
      <h2 style="margin-top:28px">Where things live</h2>
      <p class="intro">${esc(data.folders_intro)}</p>
      <div class="grid">${folders}</div>
    </section>
    <section id="private">
      <h2>What stays private</h2>
      <p class="intro">${esc(data.security_intro)}</p>
      <div class="grid">${security}</div>
    </section>
    <section id="gift">
      <h2>If you are getting one</h2>
      <p class="intro">${esc(data.gift.intro)}</p>
      <div class="steps">${required}</div>
      <div class="grid" style="margin-top:14px">
        <article class="col yes"><h3>How you use it</h3>${items(data.gift.easy)}</article>
        <article class="col no"><h3>What you do not get</h3>${items(data.gift.not)}</article>
      </div>
    </section>
    <section id="run">
      <h2>For the person who runs this</h2>
      <p class="intro">${esc(data.operator.intro)}</p>
      <dl class="facts">${facts}</dl>
      ${items(data.operator.notes)}
      <h2 style="margin-top:28px">Still true, and not a promise</h2>
      <p class="intro">These are the limits. A clean page does not make them go away.</p>
      ${limits}
      <div class="limit">
        <strong>Not on this page</strong>
        <p>If a name or a key is missing, that is the fence.</p>
        ${items(data.not_on_this_page)}
      </div>
    </section>
  `;
  document.getElementById("foot").textContent = data.footer;
}

fetch("overview.json?v=" + DATA_VERSION, { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("snapshot missing");
    return r.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("lede").textContent = "The snapshot did not load. The page is the viewer. The record is overview.json beside it.";
  });
</script>
</body>
</html>
